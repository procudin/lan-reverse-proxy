name: Release APK
on:
  push:
    paths: [Makefile]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-apk
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
          revision=$(sed -n 's/^PKG_RELEASE:=//p' Makefile)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ && "$revision" =~ ^[0-9]+$ ]]
          tag="v${version}-r${revision}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq "$tag" /tmp/release-tags; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        if: steps.version.outputs.build == 'true'
        run: |
          docker build -t lanrp-builder .
          docker run --rm --user root -v "$PWD:/work" lanrp-builder bash /work/scripts/build-apk.sh
          cd out
          cp luci-app-lan-reverse-proxy-*.apk luci-app-lan-reverse-proxy.apk
          sha256sum *.apk > SHA256SUMS
      - name: Publish release
        if: steps.version.outputs.build == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" out/*.apk out/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
